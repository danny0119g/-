<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무음 수식 그래프</title>
<style>
  :root {
    --bg:#ffffff; --fg:#111111; --muted:#666666; --card:#f2f2f2; --accent:#FFD21F; --accent-ink:#111111;
    --line:#d3d9e3; --danger:#C62F3A; --plot-bg:#ffffff; --grid:#d9dde5; --grid-minor:#eceff4; --axis:#111111;
    --c1:#E5383B; --c2:#1D6FE0; --c3:#1B9E5A; --c4:#D97706; --c5:#8B3FD9; --c6:#0E9AA7;
    --f-mono:ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#111111; --fg:#f2f2f2; --muted:#9a9a9a; --card:#1f1f1f; --line:#34383f; --danger:#FF7B84;
      --plot-bg:#161a22; --grid:#2a3040; --grid-minor:#1d222d; --axis:#dfe5f2;
      --c1:#FF6B6E; --c2:#5B9DFF; --c3:#3DD68C; --c4:#FFAA3B; --c5:#B98BFF; --c6:#3CCFD9;
    }
  }
  :root[data-theme="dark"] {
    --bg:#111111; --fg:#f2f2f2; --muted:#9a9a9a; --card:#1f1f1f; --line:#34383f; --danger:#FF7B84;
    --plot-bg:#161a22; --grid:#2a3040; --grid-minor:#1d222d; --axis:#dfe5f2;
    --c1:#FF6B6E; --c2:#5B9DFF; --c3:#3DD68C; --c4:#FFAA3B; --c5:#B98BFF; --c6:#3CCFD9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #000; color: var(--fg); overflow: hidden;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  button { font: inherit; border: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--c2); outline-offset: 2px; }
  button:disabled { opacity: .5; }
  #start { color: var(--accent-ink); background: var(--accent); }
  /* ---- 전체 화면 뷰파인더 ---- */
  .cam { position: fixed; inset: 0; background: #000; overflow: hidden; }
  #v { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #v.mirror { transform: scaleX(-1); }
  #flash { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }

  #msg {
    position: absolute; z-index: 2; left: 50%; transform: translateX(-50%);
    top: calc(12px + env(safe-area-inset-top, 0px));
    max-width: min(90%, 520px); padding: 10px 16px; border-radius: 14px;
    background: rgba(0,0,0,.6); color: #fff; font-size: 14px; line-height: 1.45;
    text-align: center; white-space: pre-line; display: none;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #start {
    position: absolute; z-index: 1; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 14px 26px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 600; font-size: 16px;
  }

  #ans {
    position: absolute; z-index: 3; left: 50%; transform: translateX(-50%);
    top: calc(12px + env(safe-area-inset-top, 0px));
    padding: 10px 22px; border-radius: 18px; background: rgba(0,0,0,.68); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: .5px; display: none; text-align: center;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #ans.busy { font-size: 16px; font-weight: 500; opacity: .85; }
  #gear {
    position: absolute; z-index: 2; top: calc(12px + env(safe-area-inset-top, 0px));
    right: max(12px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px;
  }
  #gear svg { width: 22px; height: 22px; }
  .cap { font-size: 15px; font-weight: 600; margin-top: 6px; }
  .cap:empty { display: none; }

  /* 세로 화면: 아래 가운데 촬영, 왼쪽 썸네일, 오른쪽 전환 */
  .controls {
    position: absolute; z-index: 1; left: 0; right: 0; bottom: 0;
    display: none; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 22px max(24px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,0));
  }
  .controls.on { display: grid; }
  .ctl {
    width: 52px; height: 52px; border-radius: 50%; padding: 0; color: #fff;
    background: rgba(255,255,255,.22); display: grid; place-items: center;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .ctl svg { width: 24px; height: 24px; }
  #flip { justify-self: end; }
  .thumb {
    justify-self: start; width: 52px; height: 52px; border-radius: 12px; padding: 0;
    border: 2px solid rgba(255,255,255,.85); background: #333 center / cover no-repeat; display: none;
  }
  .shot { width: 78px; height: 78px; border-radius: 50%; padding: 0; background: #fff; border: 5px solid rgba(255,255,255,.55); background-clip: padding-box; }
  .shot:active { transform: scale(.92); }

  /* 가로 화면(아이패드): 오른쪽 세로줄에 전환·촬영·썸네일 */
  @media (orientation: landscape) and (min-width: 700px) {
    .controls {
      left: auto; top: 0; grid-template-columns: none; grid-template-rows: 1fr auto 1fr; justify-items: center;
      padding: max(20px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) 24px;
      background: linear-gradient(to left, rgba(0,0,0,.45), rgba(0,0,0,0));
    }
    #flip { order: 1; justify-self: center; align-self: center; }
    .shot { order: 2; }
    .thumb { order: 3; justify-self: center; align-self: center; }
    #msg { top: max(12px, env(safe-area-inset-top, 0px)); }
  }

  #albumBtn { justify-self: start; }
  @media (orientation: landscape) and (min-width: 700px) {
    #albumBtn { order: 3; justify-self: center; align-self: center; }
  }

  /* ---- 그래프 화면 ---- */
  .gv { position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--fg); overflow: auto;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
  .gv[hidden] { display: none; }
  .gmain { max-width: 760px; margin: 0 auto; padding-block: 14px 40px; display: flex; flex-direction: column; gap: 14px; }
  .ghead { display: flex; align-items: center; gap: 12px; }
  .ghead h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -.01em; }
  .gbtn { min-height: 44px; padding: 8px 16px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 800; }
  .gbtn.sub { background: var(--card); color: var(--fg); border: 1px solid var(--line); font-weight: 700; }
  .gcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .glabel { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
  .gshot { display: flex; gap: 12px; align-items: flex-start; }
  .gshot img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); flex: none; background: #000; }
  .gst { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .status { font-weight: 800; }
  .status.err { color: var(--danger); }
  .reading { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .stop { min-height: 36px; padding: 4px 12px; border-radius: 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); align-self: flex-start; }
  .plot-wrap { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--plot-bg); aspect-ratio: 1/1; max-height: 70vh; width: 100%; }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools button { min-height: 42px; padding: 6px 16px; border-radius: 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); font-weight: 700; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  .items { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .item { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .item .sw { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--fg); padding: 0; }
  .item .sw.off { background: transparent !important; }
  .item .tx { font-weight: 800; overflow-wrap: anywhere; min-width: 0; }
  .item .del { min-height: 34px; padding: 2px 10px; font-size: 13px; border-radius: 8px; background: var(--card); color: var(--muted); border: 1px solid var(--line); }
  .item .ed { grid-column: 1/-1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
  .item input[type=text], .add input { font-family: var(--f-mono); font-size: 14px; min-width: 0; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .item input[type=text] { flex: 1 1 160px; }
  .item input.num { flex: 0 0 72px; }
  .item .k { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
  .add { display: flex; gap: 8px; flex-wrap: wrap; }
  .add input { flex: 1 1 220px; border-width: 1.5px; }
</style>
</head>
<body>
<main class="cam">
  <video id="v" autoplay playsinline muted></video>
  <div id="flash"></div>
  <div id="msg" role="status" aria-live="polite"></div>
  <button id="gear" class="ctl" aria-label="설정(API 키)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
  <button id="start" style="display:none">카메라 켜기</button>
  <div class="controls" id="row">
    <button id="albumBtn" class="ctl" aria-label="앨범에서 사진 고르기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </button>
    <button id="shot" class="shot" aria-label="촬영"></button>
    <button id="flip" class="ctl" aria-label="전면·후면 카메라 전환">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </button>
  </div>
  <input id="albumIn" type="file" accept="image/*" hidden>
</main>

<section id="gv" class="gv" hidden aria-label="그래프">
  <div class="gmain">
    <div class="ghead"><button id="back" class="gbtn">← 다시 찍기</button><h1>수식 그래프</h1></div>
    <div class="gcard">
      <div class="gshot">
        <img id="gthumb" alt="찍은 사진">
        <div class="gst">
          <div class="status" id="status"></div>
          <div class="reading" id="reading"></div>
          <button class="stop" id="stopBtn" hidden>중단</button>
        </div>
      </div>
    </div>
    <div class="gcard">
      <div class="glabel">그래프</div>
      <div class="plot-wrap" id="wrap"><canvas id="cv" aria-label="좌표평면 그래프"></canvas></div>
      <div class="tools">
        <button id="zin">확대</button><button id="zout">축소</button><button id="fit">맞춤</button><button id="save">그림 저장</button>
      </div>
      <p class="hint">한 손가락으로 끌면 이동, 두 손가락으로 확대·축소.</p>
    </div>
    <div class="gcard">
      <div class="glabel">읽은 식</div>
      <ul class="items" id="items"></ul>
      <div class="add">
        <input id="addIn" type="text" placeholder="식 추가 예: y = x^2 - 4x + 3  /  x^2 + y^2 = 9  /  x = 2" autocomplete="off" spellcheck="false">
        <button id="addBtn" class="gbtn sub">추가</button>
      </div>
      <p class="hint" id="addErr" hidden></p>
    </div>
    <span id="exBadge" hidden></span>
  </div>
</section>
<canvas id="c" style="display:none"></canvas>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var MATHN="sin|cos|tan|asin|acos|atan2|atan|sinh|cosh|tanh|sqrt|cbrt|abs|exp|floor|ceil|round|trunc|sign|log10|log2|log|pow|min|max|hypot|PI|E";
var FN=["asin","acos","atan","sinh","cosh","tanh","sin","cos","tan","sqrt","cbrt","abs","exp","floor","ceil","sign","log10","ln","log"];

/* ---------- 식 → 계산 함수 ---------- */
function norm(src){
  var s=String(src).replace(/\s+/g," ").trim();
  s=s.replace(/[−–]/g,"-").replace(/×/g,"*").replace(/÷/g,"/").replace(/π/g,"PI").replace(/\^/g,"**").replace(/²/g,"**2").replace(/³/g,"**3");
  var ph=[],PH=function(name){ph.push(name);return String.fromCharCode(0xE000+ph.length-1);};
  s=s.replace(/Math\.(\w+)/g,function(m){return PH(m);});
  s=s.replace(new RegExp("(?<![.\\w\\uE000-\\uF8FF])("+FN.join("|")+")\\s*\\(","g"),function(m,n){
    return PH("Math."+(n==="ln"?"log":n==="log"?"log10":n))+"(";});
  s=s.replace(/(?<![.A-Za-z_])pi\b/gi,"PI").replace(/(?<![.\w])e\b/g,"E").replace(/(?<=\d)e\b(?![+-]?\d)/g,"E");
  s=s.replace(/(\d|\))\s*(?=[xytE(-]|PI)/g,"$1*");
  s=s.replace(/([xytE]|PI)\s*(?=[xyt(-]|PI|E)/g,"$1*");
  s=s.replace(/[-]/g,function(c){return ph[c.charCodeAt(0)-0xE000];});
  var t=s.replace(new RegExp("Math\\.("+MATHN+")\\b","g"),"").replace(/\bPI\b|\bE\b/g,"").replace(/\d+\.?\d*(e[+-]?\d+)?|\.\d+/gi,"");
  if(/[^xyt\s+\-*\/().,<>=?:&|!%]/.test(t)) throw new Error("bad");
  return s;
}
function compile(src){
  var s=norm(src);
  var f=new Function("x","y","t","PI","E","Math","return ("+s+");");
  return function(x,y,t){return f(x,y,t,Math.PI,Math.E,Math);};
}
function splitTop(s){
  var out=[],d=0,cur="";
  for(var i=0;i<s.length;i++){var c=s[i];
    if(c==="(")d++; if(c===")")d--;
    if(c===","&&d===0){out.push(cur);cur="";}else cur+=c;}
  out.push(cur);return out;
}

/* ---------- 항목 ---------- */
var items=[],colorN=0;
function build(it){
  it._err=false;it._f=it._g=null;
  try{
    if(it.kind==="parametric"||it.kind==="point"){
      var p=splitTop(it.expr);if(p.length!==2)throw new Error("n");
      it._f=compile(p[0]);it._g=compile(p[1]);
    }else if(it.kind==="vline"){
      var c=compile(it.expr)(0,0,0);if(typeof c!=="number"||!isFinite(c))throw new Error("n");it._c=c;
    }else it._f=compile(it.expr);
  }catch(e){it._err=true;}
}
function mk(o){
  var it={kind:o.kind,text:o.text||o.expr,expr:o.expr,dmin:o.dmin==null?null:o.dmin,dmax:o.dmax==null?null:o.dmax,
    tmin:o.tmin==null?0:o.tmin,tmax:o.tmax==null?2*Math.PI:o.tmax,open:!!o.open,on:true,ci:colorN++%6};
  build(it);return it;
}
function num(v){var n=Number(v);return isFinite(n)?n:null;}
function parseManual(str){
  var s=String(str).trim();if(!s)throw new Error("empty");
  var m;
  if((m=s.match(/^(?:y|f\(x\))\s*=\s*(.+)$/i)))return {kind:"function",text:"y = "+m[1],expr:m[1]};
  if((m=s.match(/^x\s*=\s*([^=<>]+)$/i)))return {kind:"vline",text:"x = "+m[1],expr:m[1]};
  if(/^[^=<>]*=[^=<>]*$/.test(s)){var q=s.split("=");return {kind:"implicit",text:s,expr:"("+q[0]+")-("+q[1]+")"};}
  return {kind:"function",text:"y = "+s,expr:s};
}

/* ---------- 좌표평면 ---------- */
var cv=$("cv"),ctx=cv.getContext("2d"),W=300,H=300,dpr=1;
var view={cx:0,cy:0,s:40},lastView={xmin:-6,xmax:6,ymin:-6,ymax:6},fitted=false;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fitTo(v){
  view.cx=(v.xmin+v.xmax)/2;view.cy=(v.ymin+v.ymax)/2;
  view.s=Math.max(2,Math.min(4000,Math.min(W/(v.xmax-v.xmin),H/(v.ymax-v.ymin))));
  draw();
}
function niceStep(raw){
  var p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,k=m<=1?1:m<=2?2:m<=5?5:10;
  return {step:k*p,k:k};
}
function fmt(v,step){
  var dec=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  var r=Number(v.toFixed(Math.min(dec,8)));if(Object.is(r,-0))r=0;return String(r);
}
var raf=0;function draw(){if(!raf)raf=requestAnimationFrame(function(){raf=0;paint();});}
function resize(){
  var r=cv.getBoundingClientRect();if(!r.width||!r.height)return;
  dpr=window.devicePixelRatio||1;W=r.width;H=r.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  if(!fitted){fitted=true;fitTo(lastView);}else draw();
}
function px(x){return W/2+(x-view.cx)*view.s;}
function py(y){return H/2-(y-view.cy)*view.s;}
function paint(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=css("--plot-bg");ctx.fillRect(0,0,W,H);
  var s=view.s,n=niceStep(70/s),step=n.step,minor=step/(n.k===2?4:5);
  var x0=view.cx-W/2/s,x1=view.cx+W/2/s,y0=view.cy-H/2/s,y1=view.cy+H/2/s,i,v;
  ctx.lineWidth=1;
  if(minor*s>=9){ctx.strokeStyle=css("--grid-minor");ctx.beginPath();
    for(v=Math.ceil(x0/minor)*minor;v<=x1;v+=minor){var a=Math.round(px(v))+.5;ctx.moveTo(a,0);ctx.lineTo(a,H);}
    for(v=Math.ceil(y0/minor)*minor;v<=y1;v+=minor){var b=Math.round(py(v))+.5;ctx.moveTo(0,b);ctx.lineTo(W,b);}
    ctx.stroke();}
  ctx.strokeStyle=css("--grid");ctx.beginPath();
  for(v=Math.ceil(x0/step)*step;v<=x1;v+=step){var c=Math.round(px(v))+.5;ctx.moveTo(c,0);ctx.lineTo(c,H);}
  for(v=Math.ceil(y0/step)*step;v<=y1;v+=step){var d=Math.round(py(v))+.5;ctx.moveTo(0,d);ctx.lineTo(W,d);}
  ctx.stroke();
  var ax=Math.min(W-1,Math.max(1,px(0))),ay=Math.min(H-1,Math.max(1,py(0)));
  var axis=css("--axis");ctx.strokeStyle=axis;ctx.lineWidth=1.6;ctx.beginPath();
  ctx.moveTo(0,ay);ctx.lineTo(W,ay);ctx.moveTo(ax,0);ctx.lineTo(ax,H);ctx.stroke();
  ctx.fillStyle=axis;ctx.font="11px "+css("--f-mono");
  ctx.textAlign="center";ctx.textBaseline="top";
  var xl=ay<H-20?ay+4:ay-16;

    if(ctl!==cc)return;
    stopTimer();
    if(!obj){setStatus("식을 정리하지 못했습니다. 식이 크게 보이게 밝은 곳에서 다시 찍어 보세요.",true);return;}
    applyResult(obj);
  }catch(e){
    if(ctl!==cc)return;
    stopTimer();
    var ab=e&&e.name==="AbortError";
    setStatus(ab?"중단했습니다.":"읽기에 실패했습니다. 네트워크를 확인해 주세요.",!ab);
  }finally{clearTimeout(kill);}
}
function capture(){
  if(busy||!stream||!v.videoWidth)return;
  c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  shutterEffect();
  handle(c);
}
startBtn.onclick=startCamera;
shotBtn.onclick=capture;
flipBtn.onclick=function(){facing=facing==="environment"?"user":"environment";startCamera();};
$("gear").onclick=function(){
  var k=prompt("Anthropic API 키를 입력하세요.\n이 기기의 브라우저에만 저장됩니다. 비우고 확인하면 삭제됩니다.","");
  if(k===null)return;
  k=k.trim();var ok=setKey(k);
  setMsg(!ok?"키를 저장하지 못했습니다.":k?"키를 저장했습니다.":"키를 삭제했습니다.",2000);
};
$("albumBtn").onclick=function(){$("albumIn").click();};
$("albumIn").onchange=async function(e){
  var f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    var bmp=await createImageBitmap(f);
    c.width=bmp.width;c.height=bmp.height;c.getContext("2d").drawImage(bmp,0,0);
    handle(c);
  }catch(err){setMsg("사진을 열지 못했습니다. 다른 사진을 골라 주세요.",3000);}
};
$("back").onclick=function(){
  if(ctl){ctl.abort();ctl=null;}
  stopTimer();$("gv").hidden=true;
};
$("stopBtn").onclick=function(){if(ctl)ctl.abort();};
$("save").onclick=function(){
  cv.toBlob(function(b){
    if(!b)return;
    var file=new File([b],"graph.png",{type:"image/png"});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});return;}}catch(e){}
    var u=URL.createObjectURL(b),a=document.createElement("a");
    a.href=u;a.download="graph.png";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},4000);
  },"image/png");
};
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible"||!wantOn||busy)return;
  var t=stream&&stream.getVideoTracks()[0];
  if(!t||t.readyState==="ended")startCamera();
});

/* ---------- 시작 ---------- */
render();
new ResizeObserver(resize).observe($("wrap"));
if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
startCamera();
})();
</script>
</body>
</html>
