<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>둘만의 채팅</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg:#f4f1ec; --panel:#fff; --text:#23211d; --muted:#8a857c; --line:#e6e1d8;
    --mine:#3a6ff7; --mine-text:#fff; --theirs:#fff; --theirs-text:#23211d;
    --accent:#3a6ff7; --ok:#2fb56a; --danger:#d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#17171a; --panel:#202024; --text:#ececee; --muted:#8d8d95; --line:#303036;
      --mine:#4a7cff; --theirs:#2a2a30; --theirs-text:#ececee; --accent:#4a7cff;
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  html{height:100%}
  body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:15px;line-height:1.45}
  .app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:16px;font-weight:700;flex:1}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok)}
  .hbtn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
  #banner{display:none;padding:8px 16px;font-size:13px;background:color-mix(in srgb,var(--danger) 12%,var(--panel));color:var(--danger);border-bottom:1px solid var(--line)}
  #banner.show{display:block}
  #list{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:2px}
  .empty{margin:auto;text-align:center;color:var(--muted);padding:24px}
  .day{align-self:center;margin:12px 0 8px;padding:3px 12px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent);border-radius:999px}
  .row{display:flex;align-items:flex-end;gap:8px}
  .row.mine{flex-direction:row-reverse}
  .row.first{margin-top:8px}
  .col{display:flex;flex-direction:column;max-width:78%;min-width:0}
  .row.mine .col{align-items:flex-end}
  .name{font-size:12px;color:var(--muted);margin:0 4px 3px}
  .line{display:flex;align-items:flex-end;gap:6px}
  .row.mine .line{flex-direction:row-reverse}
  .bubble{padding:8px 12px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--theirs);color:var(--theirs-text);border:1px solid var(--line)}
  .row.mine .bubble{background:var(--mine);color:var(--mine-text);border-color:transparent}
  .time{font-size:11px;color:var(--muted);white-space:nowrap}
  .del{display:none;border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0 2px}
  .row.mine:hover .del,.row.mine:focus-within .del{display:inline}
  .del:hover{color:var(--danger)}
  @media(hover:none){.row.mine .del{display:inline;opacity:.55}}
  #typing{height:20px;padding:0 18px;font-size:12px;color:var(--muted)}
  form.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;max-height:120px;min-height:40px;padding:9px 14px;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--text);font:inherit;outline:none}
  textarea:focus{border-color:var(--accent)}
  button.send{flex:none;height:40px;padding:0 18px;border:0;border-radius:20px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.send:disabled{opacity:.4;cursor:default}
  #toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:.95}
  /* 이름 입력 / 설정 안내 오버레이 */
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
  #overlay.show{display:flex}
  .card{background:var(--panel);border-radius:16px;padding:22px;max-width:420px;width:100%}
  .card h2{margin:0 0 8px;font-size:17px}
  .card p{margin:0 0 14px;color:var(--muted);font-size:14px}
  .card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:12px}
  .card button{width:100%;height:42px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>💬 둘만의 채팅</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">연결 중…</span></div>
    <button class="hbtn" id="inviteBtn" type="button">초대 링크</button>
  </header>
  <div id="banner"></div>
  <main id="list"><div class="empty">불러오는 중…</div></main>
  <div id="typing"></div>
  <form class="composer" id="form" autocomplete="off">
    <textarea id="input" rows="1" placeholder="메시지를 입력하세요" maxlength="2000"></textarea>
    <button class="send" id="send" type="submit" disabled>전송</button>
  </form>
</div>
<div id="toast"></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, deleteDoc, query, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ▼▼▼ Firebase 콘솔 → 프로젝트 설정 → 내 앱(웹)에서 복사한 값으로 교체하세요 ▼▼▼ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
/* ▲▲▲ (웹 앱 설정값은 비밀이 아니며, 보안은 firestore.rules가 담당합니다) ▲▲▲ */

const $ = (id) => document.getElementById(id);
const listEl = $('list'), inputEl = $('input'), sendEl = $('send'), formEl = $('form');
const bannerEl = $('banner'), typingEl = $('typing'), dotEl = $('dot'), statusEl = $('statusText');
const toastEl = $('toast'), overlay = $('overlay'), card = $('card');

let toastTimer = null;
function toast(t){ toastEl.textContent=t; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2500); }
function showBanner(t){ bannerEl.textContent=t; bannerEl.classList.add('show'); }
function showCard(html){ card.innerHTML = html; overlay.classList.add('show'); }
function hideCard(){ overlay.classList.remove('show'); }

/* ---------- 설정 안 했을 때 ---------- */
if (firebaseConfig.apiKey === "YOUR_API_KEY") {
  listEl.innerHTML = '<div class="empty">Firebase 설정이 아직 없어요.</div>';
  showCard('<h2>Firebase 설정이 필요해요</h2><p>index.html 상단의 <b>firebaseConfig</b> 값을 본인 Firebase 프로젝트 값으로 바꿔 주세요. 자세한 순서는 README.md에 있어요.</p>');
  throw new Error("firebaseConfig not set");
}

/* ---------- 방 ID (URL 해시) ---------- */
function randomId(n = 24){
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return Array.from(a, b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join('');
}
let roomId = new URLSearchParams(location.hash.slice(1)).get('room');
if (!roomId || !/^[a-z0-9]{16,64}$/.test(roomId)) {
  roomId = randomId();
  history.replaceState(null, '', location.pathname + location.search + '#room=' + roomId);
}
const inviteUrl = () => location.origin + location.pathname + '#room=' + roomId;
$('inviteBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(inviteUrl()); toast('초대 링크를 복사했어요'); }
  catch { prompt('이 링크를 상대방에게 보내세요', inviteUrl()); }
});

/* ---------- 닉네임 ---------- */
let myName = '';
try { myName = localStorage.getItem('chat:name') || ''; } catch {}
function askName(){
  return new Promise(resolve => {
    showCard('<h2>이름을 알려주세요</h2><p>상대방 화면에 표시될 이름이에요.</p><input id="nameIn" maxlength="30" placeholder="예: 민수"><button id="nameOk" type="button">시작하기</button>');
    const inp = $('nameIn'), ok = $('nameOk');
    inp.focus();
    const done = () => {
      const v = inp.value.trim().slice(0,30); if (!v) return;
      try { localStorage.setItem('chat:name', v); } catch {}
      hideCard(); resolve(v);
    };
    ok.addEventListener('click', done);
    inp.addEventListener('keydown', e => { if (e.key==='Enter' && !e.isComposing) done(); });
  });
}

/* ---------- 유틸 ---------- */
const fmtTime = ts => new Date(ts).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
const dayKey = ts => { const d=new Date(ts); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); };
const fmtDay = ts => new Date(ts).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
const nearBottom = () => listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 120;

/* ---------- 메인 ---------- */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let myUid = null, msgs = [], others = {};

function render(force){
  const stick = force || nearBottom();
  listEl.textContent = '';
  if (!msgs.length) {
    const e = document.createElement('div'); e.className='empty';
    e.textContent='아직 메시지가 없어요. 상단의 "초대 링크"를 상대방에게 보내고 첫 인사를 남겨보세요 👋';
    listEl.appendChild(e); return;
  }
  let prev = null;
  msgs.forEach((m,i) => {
    if (!prev || dayKey(prev.ts) !== dayKey(m.ts)) {
      const d = document.createElement('div'); d.className='day'; d.textContent=fmtDay(m.ts); listEl.appendChild(d);
    }
    const next = msgs[i+1];
    const samePrev = prev && prev.uid===m.uid && dayKey(prev.ts)===dayKey(m.ts) && (m.ts-prev.ts)<180000;
    const sameNext = next && next.uid===m.uid && dayKey(next.ts)===dayKey(m.ts) && (next.ts-m.ts)<180000;
    const mine = m.uid === myUid;

    const row = document.createElement('div');
    row.className = 'row' + (mine?' mine':'') + (samePrev?'':' first');
    const col = document.createElement('div'); col.className='col';
    if (!mine && !samePrev) { const n=document.createElement('div'); n.className='name'; n.textContent=m.name||'상대방'; col.appendChild(n); }
    const line = document.createElement('div'); line.className='line';
    const b = document.createElement('div'); b.className='bubble'; b.textContent=m.text; line.appendChild(b);
    if (!sameNext) { const t=document.createElement('span'); t.className='time'; t.textContent=fmtTime(m.ts); line.appendChild(t); }
    if (mine) {
      const del=document.createElement('button'); del.type='button'; del.className='del'; del.textContent='삭제';
      del.addEventListener('click', async () => { try { await deleteDoc(doc(db,'rooms',roomId,'messages',m.id)); } catch { toast('삭제하지 못했어요'); } });
      line.appendChild(del);
    }
    col.appendChild(line); row.appendChild(col); listEl.appendChild(row);
    prev = m;
  });
  if (stick) listEl.scrollTop = listEl.scrollHeight;
}

function updateOthers(){
  const now = Date.now();
  const online = Object.values(others).filter(p => now - p.ts < 45000);
  dotEl.classList.toggle('on', online.length > 0);
  statusEl.textContent = online.length ? (online[0].name || '상대방') + ' 접속 중' : '상대방 오프라인';
  const typing = online.find(p => p.typingAt && now - p.typingAt < 4000);
  typingEl.textContent = typing ? (typing.name || '상대방') + '님이 입력 중…' : '';
}

let presenceRef = null, lastTypingWrite = 0;
async function writePresence(extra = {}){
  if (!presenceRef) return;
  try { await setDoc(presenceRef, { name: myName, ts: Date.now(), ...extra }, { merge: true }); } catch {}
}

async function start(){
  if (!myName) myName = await askName();

  try { await signInAnonymously(auth); }
  catch (e) {
    showBanner('로그인에 실패했어요. Firebase 콘솔에서 "익명 로그인"을 켰는지 확인해 주세요.');
    statusEl.textContent = '연결 안 됨'; return;
  }
  onAuthStateChanged(auth, user => {
    if (!user || myUid) return;
    myUid = user.uid;

    const q = query(collection(db,'rooms',roomId,'messages'), orderBy('ts','desc'), limit(200));
    onSnapshot(q, snap => {
      msgs = snap.docs.map(d => {
        const v = d.data();
        const ts = v.ts && v.ts.toMillis ? v.ts.toMillis() : Date.now();
        return { id:d.id, uid:v.uid, name:v.name, text:String(v.text||''), ts };
      }).reverse();
      render(false);
    }, err => {
      showBanner(err.code === 'permission-denied'
        ? '접근이 거부됐어요. Firestore 보안 규칙(firestore.rules)을 게시했는지 확인해 주세요.'
        : '메시지를 불러오지 못했어요. 새로고침해 주세요.');
    });

    presenceRef = doc(db,'rooms',roomId,'presence',myUid);
    onSnapshot(collection(db,'rooms',roomId,'presence'), snap => {
      others = {};
      snap.docs.forEach(d => { if (d.id !== myUid) others[d.id] = d.data(); });
      updateOthers();
    }, () => {});
    writePresence();
    setInterval(() => { if (!document.hidden) writePresence(); }, 20000);
    setInterval(updateOthers, 2000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) writePresence(); });
    autoGrow();
  });
}

function autoGrow(){
  inputEl.style.height='auto';
  inputEl.style.height=Math.min(inputEl.scrollHeight,120)+'px';
  sendEl.disabled = !inputEl.value.trim() || !myUid;
}

async function send(){
  const text = inputEl.value.replace(/\s+$/,'');
  if (!text.trim() || !myUid) return;
  inputEl.value=''; autoGrow();
  try {
    await addDoc(collection(db,'rooms',roomId,'messages'), { uid:myUid, name:myName, text, ts:serverTimestamp() });
    render(true);
    writePresence({ typingAt: 0 });
  } catch (e) {
    inputEl.value = text; autoGrow();
    toast(e.code==='permission-denied' ? '전송 권한이 없어요. 보안 규칙을 확인해 주세요.' : '전송에 실패했어요. 다시 시도해 주세요.');
  }
}

inputEl.addEventListener('input', () => {
  autoGrow();
  const now = Date.now();
  if (inputEl.value && now - lastTypingWrite > 2500) { lastTypingWrite = now; writePresence({ typingAt: now }); }
});
inputEl.addEventListener('keydown', e => {
  if (e.key==='Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
formEl.addEventListener('submit', e => { e.preventDefault(); send(); });

start();
</script>
</body>
</html>
