<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무음 카메라</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #666666; --card: #f2f2f2; --accent: #2563eb;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111111; --fg: #f2f2f2; --muted: #999999; --card: #222222; --accent: #60a5fa; }
  }
  :root[data-theme="dark"] { --bg: #111111; --fg: #f2f2f2; --muted: #999999; --card: #222222; --accent: #60a5fa; }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .wrap {
    max-width: 900px; margin: 0 auto; padding: 12px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .view { position: relative; background: #000; border-radius: 14px; overflow: hidden; }
  video { width: 100%; max-height: 70vh; max-height: 70dvh; display: block; background: #000; object-fit: contain; }
  video.mirror { transform: scaleX(-1); }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 18px; background: var(--card); color: var(--fg); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; }
  button.shot { width: 76px; height: 76px; border-radius: 50%; background: #fff; border: 5px solid var(--accent); padding: 0; }
  button.shot:active { transform: scale(.92); }
  #start { background: var(--accent); color: #fff; font-weight: 600; }
  #msg { text-align: center; color: var(--muted); font-size: 14px; margin: 8px 0; white-space: pre-line; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .15s; }
  @media (prefers-reduced-motion: reduce) { #flash { transition: none; } }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
  .item { background: var(--card); border-radius: 12px; padding: 8px; }
  .item img { width: 100%; border-radius: 8px; display: block; -webkit-touch-callout: default; }
  .item .btns { display: flex; gap: 6px; margin-top: 6px; }
  .item button { flex: 1; padding: 8px; font-size: 13px; background: var(--bg); }
  h2 { font-size: 15px; margin: 18px 0 4px; }
  .hint { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="view">
    <video id="v" autoplay playsinline muted></video>
    <div id="flash"></div>
  </div>
  <div id="msg" role="status" aria-live="polite">아래 '카메라 켜기'를 누르고 카메라 접근을 허용해 주세요.</div>
  <div class="row">
    <button id="start">카메라 켜기</button>
    <button id="shot" class="shot" aria-label="촬영" style="display:none"></button>
    <button id="flip" aria-label="전면·후면 카메라 전환" style="display:none">전/후면 전환</button>
  </div>
  <h2>찍은 사진</h2>
  <div class="hint">사진은 이 페이지에만 임시로 보관됩니다. 새로고침하거나 닫기 전에 저장해 주세요.
    사진을 길게 눌러 '사진에 추가'로 저장하거나 '공유/저장' 버튼을 사용할 수 있습니다.</div>
  <div id="gallery"></div>
</div>
<canvas id="c" style="display:none"></canvas>
<script>
(function () {
  var v = document.getElementById('v');
  var c = document.getElementById('c');
  var msg = document.getElementById('msg');
  var startBtn = document.getElementById('start');
  var shotBtn = document.getElementById('shot');
  var flipBtn = document.getElementById('flip');
  var gallery = document.getElementById('gallery');
  var flash = document.getElementById('flash');
  var stream = null;
  var facing = 'environment';
  var busy = false;      // 카메라를 여는 중이면 true (중복 호출 방지)
  var wantOn = false;    // 사용자가 카메라를 켠 상태인지
  var photoCount = 0;    // 갤러리에 남아 있는 사진 수
  var serial = 0;

  function setMsg(t) { msg.textContent = t; }

  function stopStream() {
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
  }

  function setControls(on) {
    startBtn.style.display = on ? 'none' : '';
    shotBtn.style.display = on ? '' : 'none';
    flipBtn.style.display = on ? '' : 'none';
  }

  function explain(e) {
    var name = e && e.name ? e.name : '';
    switch (name) {
      case 'NotAllowedError':
      case 'SecurityError':
        return '카메라 접근이 허용되지 않았습니다.\n설정 > Safari > 카메라에서 허용으로 바꾼 뒤 다시 시도해 주세요.\n앱 안의 미리보기라면 링크를 Safari에서 직접 열어 주세요.';
      case 'NotFoundError':
      case 'DevicesNotFoundError':
        return '사용할 수 있는 카메라를 찾지 못했습니다.\n전/후면 전환 중이라면 이 기기에 해당 카메라가 없을 수 있습니다.';
      case 'NotReadableError':
      case 'TrackStartError':
        return '카메라를 사용할 수 없습니다.\n다른 앱이나 탭이 카메라를 쓰고 있다면 닫고 다시 시도해 주세요.';
      case 'OverconstrainedError':
        return '요청한 카메라 설정을 지원하지 않습니다. 다시 시도해 주세요.';
      default:
        return '카메라를 열지 못했습니다: ' + (name || e);
    }
  }

  async function startCamera() {
    if (busy) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      var secure = window.isSecureContext !== false;
      setMsg(secure
        ? '이 화면에서는 카메라를 쓸 수 없습니다.\n링크를 Safari 브라우저에서 직접 열어 주세요.'
        : '카메라는 HTTPS 주소에서만 사용할 수 있습니다.\nhttps:// 로 시작하는 주소로 열어 주세요.');
      return;
    }
    busy = true;
    startBtn.disabled = flipBtn.disabled = shotBtn.disabled = true;
    stopStream();
    try {
      var s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 4096 }, height: { ideal: 3072 } },
        audio: false
      });
      stream = s;
      var track = s.getVideoTracks()[0];
      if (track) {
        // 다른 앱이 카메라를 가져가거나 시스템이 끊었을 때 상태를 되돌린다
        track.addEventListener('ended', function () {
          if (stream === s) { stream = null; setMsg('카메라 연결이 끊어졌습니다. 화면으로 돌아오면 다시 연결합니다.'); }
        });
      }
      v.srcObject = s;
      // 전면 카메라는 프리뷰만 좌우 반전(거울 모드). 저장되는 사진은 반전하지 않는다.
      var settings = track && track.getSettings ? track.getSettings() : {};
      var isFront = settings.facingMode ? settings.facingMode === 'user' : facing === 'user';
      v.classList.toggle('mirror', isFront);
      await v.play();
      wantOn = true;
      setControls(true);
      var res = v.videoWidth ? ' (' + v.videoWidth + '×' + v.videoHeight + ')' : '';
      setMsg('준비 완료' + res + '. 동그란 버튼을 누르면 무음으로 촬영됩니다.');
    } catch (e) {
      stopStream();
      wantOn = false;
      setControls(false);
      setMsg(explain(e));
    } finally {
      busy = false;
      startBtn.disabled = flipBtn.disabled = shotBtn.disabled = false;
    }
  }

  function capture() {
    if (busy || !stream || !v.videoWidth) return;
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    flash.style.opacity = '0.6';
    setTimeout(function () { flash.style.opacity = '0'; }, 120);
    c.toBlob(function (blob) {
      if (!blob) { setMsg('사진을 만들지 못했습니다. 다시 시도해 주세요.'); return; }
      serial++;
      photoCount++;
      var url = URL.createObjectURL(blob);
      var stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
      var name = 'photo_' + stamp + '_' + serial + '.jpg';
      var item = document.createElement('div');
      item.className = 'item';
      var img = document.createElement('img');
      img.src = url;
      img.alt = name;
      var btns = document.createElement('div');
      btns.className = 'btns';

      var share = document.createElement('button');
      share.textContent = '공유/저장';
      share.onclick = async function () {
        var file = new File([blob], name, { type: 'image/jpeg' });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file] });
            return;
          }
        } catch (e) {
          if (e && e.name === 'AbortError') return; // 사용자가 취소
        }
        // 공유를 지원하지 않으면 파일로 내려받기
        var a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setMsg('내려받기를 시작했습니다. 저장되지 않으면 사진을 길게 눌러 저장해 주세요.');
      };

      var del = document.createElement('button');
      del.textContent = '삭제';
      del.onclick = function () {
        URL.revokeObjectURL(url);
        item.remove();
        photoCount = Math.max(0, photoCount - 1);
      };

      btns.appendChild(share);
      btns.appendChild(del);
      item.appendChild(img);
      item.appendChild(btns);
      gallery.insertBefore(item, gallery.firstChild);
    }, 'image/jpeg', 0.95);
  }

  startBtn.onclick = startCamera;
  shotBtn.onclick = capture;
  flipBtn.onclick = function () {
    facing = facing === 'environment' ? 'user' : 'environment';
    startCamera();
  };

  // 앱을 다른 화면으로 벗어났다가 돌아오면 끊긴 카메라를 다시 연결
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !wantOn || busy) return;
    var track = stream && stream.getVideoTracks()[0];
    if (!track || track.readyState === 'ended') startCamera();
  });

  // 저장하지 않은 사진이 있으면 닫기/새로고침 전에 확인
  window.addEventListener('beforeunload', function (e) {
    if (photoCount > 0) { e.preventDefault(); e.returnValue = ''; }
  });
})();
</script>
</body>
</html>
