<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무음 카메라</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #666666; --card: #f2f2f2; --accent: #2563eb;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111111; --fg: #f2f2f2; --muted: #999999; --card: #222222; --accent: #60a5fa; }
  }
  :root[data-theme="dark"] { --bg: #111111; --fg: #f2f2f2; --muted: #999999; --card: #222222; --accent: #60a5fa; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: #000; color: var(--fg); overflow: hidden;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  button { font: inherit; border: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; }

  /* ---- 전체 화면 뷰파인더 ---- */
  .cam { position: fixed; inset: 0; background: #000; overflow: hidden; }
  #v { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #v.mirror { transform: scaleX(-1); }
  #flash { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }

  #msg {
    position: absolute; z-index: 2; left: 50%; transform: translateX(-50%);
    top: calc(12px + env(safe-area-inset-top, 0px));
    max-width: min(90%, 520px); padding: 10px 16px; border-radius: 14px;
    background: rgba(0,0,0,.6); color: #fff; font-size: 14px; line-height: 1.45;
    text-align: center; white-space: pre-line; display: none;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #start {
    position: absolute; z-index: 1; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 14px 26px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 600; font-size: 16px;
  }

  #ans {
    position: absolute; z-index: 3; left: 50%; transform: translateX(-50%);
    top: calc(12px + env(safe-area-inset-top, 0px));
    padding: 10px 22px; border-radius: 18px; background: rgba(0,0,0,.68); color: #fff;
    font-size: 30px; font-weight: 700; letter-spacing: .5px; display: none; text-align: center;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #ans.busy { font-size: 16px; font-weight: 500; opacity: .85; }
  #gear {
    position: absolute; z-index: 2; top: calc(12px + env(safe-area-inset-top, 0px));
    right: max(12px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px;
  }
  #gear svg { width: 22px; height: 22px; }
  .cap { font-size: 15px; font-weight: 600; margin-top: 6px; }
  .cap:empty { display: none; }

  /* 세로 화면: 아래 가운데 촬영, 왼쪽 썸네일, 오른쪽 전환 */
  .controls {
    position: absolute; z-index: 1; left: 0; right: 0; bottom: 0;
    display: none; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 22px max(24px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,0));
  }
  .controls.on { display: grid; }
  .ctl {
    width: 52px; height: 52px; border-radius: 50%; padding: 0; color: #fff;
    background: rgba(255,255,255,.22); display: grid; place-items: center;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .ctl svg { width: 24px; height: 24px; }
  #flip { justify-self: end; }
  .thumb {
    justify-self: start; width: 52px; height: 52px; border-radius: 12px; padding: 0;
    border: 2px solid rgba(255,255,255,.85); background: #333 center / cover no-repeat; display: none;
  }
  .shot { width: 78px; height: 78px; border-radius: 50%; padding: 0; background: #fff; border: 5px solid rgba(255,255,255,.55); background-clip: padding-box; }
  .shot:active { transform: scale(.92); }

  /* 가로 화면(아이패드): 오른쪽 세로줄에 전환·촬영·썸네일 */
  @media (orientation: landscape) and (min-width: 700px) {
    .controls {
      left: auto; top: 0; grid-template-columns: none; grid-template-rows: 1fr auto 1fr; justify-items: center;
      padding: max(20px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) 24px;
      background: linear-gradient(to left, rgba(0,0,0,.45), rgba(0,0,0,0));
    }
    #flip { order: 1; justify-self: center; align-self: center; }
    .shot { order: 2; }
    .thumb { order: 3; justify-self: center; align-self: center; }
    #msg { top: max(12px, env(safe-area-inset-top, 0px)); }
  }

  /* ---- 찍은 사진 보기 ---- */
  #panel { position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--fg); overflow: auto;
    padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(12px, env(safe-area-inset-left, 0px)); }
  #panel[hidden] { display: none; }
  .panel-in { max-width: 900px; margin: 0 auto; padding: 12px 0 24px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; }
  #close { padding: 10px 16px; border-radius: 12px; background: var(--card); color: var(--fg); }
  h2 { font-size: 17px; margin: 0; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
  .item { background: var(--card); border-radius: 12px; padding: 8px; }
  .item img { width: 100%; border-radius: 8px; display: block; -webkit-touch-callout: default; }
  .item .btns { display: flex; gap: 6px; margin-top: 6px; }
  .item button { flex: 1; padding: 8px; font-size: 13px; border-radius: 10px; background: var(--bg); color: var(--fg); }
</style>
</head>
<body>
<main class="cam">
  <video id="v" autoplay playsinline muted></video>
  <div id="flash"></div>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="ans" role="status" aria-live="polite"></div>
  <button id="gear" class="ctl" aria-label="설정(API 키)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
  <button id="start" style="display:none">카메라 켜기</button>
  <div class="controls" id="row">
    <button id="thumb" class="thumb" aria-label="찍은 사진 보기"></button>
    <button id="shot" class="shot" aria-label="촬영"></button>
    <button id="flip" class="ctl" aria-label="전면·후면 카메라 전환">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </button>
  </div>
</main>

<section id="panel" hidden aria-label="찍은 사진">
  <div class="panel-in">
    <div class="panel-head">
      <h2>찍은 사진</h2>
      <button id="close">닫기</button>
    </div>
    <div id="gallery"></div>
  </div>
</section>
<canvas id="c" style="display:none"></canvas>

<script>
(function () {
  var v = document.getElementById('v');
  var c = document.getElementById('c');
  var msg = document.getElementById('msg');
  var startBtn = document.getElementById('start');
  var shotBtn = document.getElementById('shot');
  var flipBtn = document.getElementById('flip');
  var thumbBtn = document.getElementById('thumb');
  var row = document.getElementById('row');
  var gallery = document.getElementById('gallery');
  var flash = document.getElementById('flash');
  var panel = document.getElementById('panel');
  var closeBtn = document.getElementById('close');
  var stream = null;
  var facing = 'environment';
  var busy = false;      // 카메라를 여는 중이면 true (중복 호출 방지)
  var wantOn = false;    // 사용자가 카메라를 켠 상태인지
  var photoCount = 0;    // 갤러리에 남아 있는 사진 수
  var serial = 0;
  var msgTimer = null;
  var ansEl = document.getElementById('ans');
  var gearBtn = document.getElementById('gear');
  var MODEL = 'claude-sonnet-5-5';   // 풀이에 쓸 모델
  var KEY_NAME = 'anthropic_key';    // 키는 이 기기의 브라우저에만 저장된다 (코드/저장소에 넣지 않는다)
  var latestId = 0;

  var SYSTEM = [
    '당신은 대한민국 대학수학능력시험 과학탐구 지구과학Ⅰ 전문가입니다.',
    '사진에 지구과학Ⅰ 문제가 있는지 판단하고, 있으면 풀어서 정답을 냅니다.',
    '지구과학Ⅰ 문제가 아니거나(다른 과목, 문제 아님, 판독 불가) 확신할 수 없으면 found를 false로 합니다.',
    '여러 문제가 보이면 가장 선명하고 화면 중심에 있는 문제 하나만 풉니다.',
    '자료(그래프, 표, 그림, 보기)를 정확히 판독하고, 수능 시험장에서 손으로 풀 수 있는 방식(특수각, 정수비, 부등식 비교 등)으로 신중히 풉니다.',
    '풀이는 간결하게 쓰고, 마지막 줄에는 반드시 JSON 한 줄만 씁니다.',
    '정답이 있으면 {"found":true,"answer":"③"} 형식(선택지 번호는 ①②③④⑤, 주관식이면 값), 없으면 {"found":false}.'
  ].join('\n');

  function getKey() { try { return localStorage.getItem(KEY_NAME) || ''; } catch (e) { return ''; } }
  function setKey(k) {
    try { if (k) localStorage.setItem(KEY_NAME, k); else localStorage.removeItem(KEY_NAME); return true; }
    catch (e) { return false; }
  }

  function setAns(text, busy) {
    ansEl.textContent = text || '';
    ansEl.classList.toggle('busy', !!busy);
    ansEl.style.display = text ? 'block' : 'none';
  }

  // API로 보낼 이미지는 긴 변 1568px로 줄여 속도와 비용을 아낀다
  function toApiImage(canvas) {
    var max = 1568;
    var scale = Math.min(1, max / Math.max(canvas.width, canvas.height));
    var t = document.createElement('canvas');
    t.width = Math.round(canvas.width * scale);
    t.height = Math.round(canvas.height * scale);
    t.getContext('2d').drawImage(canvas, 0, 0, t.width, t.height);
    return t.toDataURL('image/jpeg', 0.85).split(',')[1];
  }

  function parseResult(text) {
    var m = text.match(/\{[^{}]*"found"[^{}]*\}/g);
    if (!m) return null;
    try { return JSON.parse(m[m.length - 1]); } catch (e) { return null; }
  }

  async function solve(b64, capEl, id) {
    var key = getKey();
    if (!key) return;
    setAns('풀이 중…', true);
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 90000);
    try {
      var res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        signal: ctrl.signal,
        headers: {
          'content-type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 3000,
          system: SYSTEM,
          messages: [{ role: 'user', content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
            { type: 'text', text: '이 사진에 지구과학Ⅰ 문제가 있으면 풀어 주세요.' }
          ] }]
        })
      });
      if (!res.ok) {
        if (id === latestId) setAns('');
        setMsg(res.status === 401 ? '키가 올바르지 않습니다. 설정(톱니바퀴)에서 다시 입력해 주세요.'
          : res.status === 429 ? '요청이 많습니다. 잠시 후 다시 시도해 주세요.'
          : '풀이에 실패했습니다. (' + res.status + ')', 4000);
        return;
      }
      var data = await res.json();
      var text = (data.content || []).map(function (b) { return b.type === 'text' ? b.text : ''; }).join('\n');
      var r = parseResult(text);
      var ok = r && r.found && r.answer;
      if (ok) capEl.textContent = '정답 ' + r.answer;
      if (id === latestId) setAns(ok ? '정답 ' + r.answer : '');
    } catch (e) {
      if (id === latestId) setAns('');
      setMsg('풀이에 실패했습니다. 네트워크를 확인해 주세요.', 4000);
    } finally {
      clearTimeout(timer);
    }
  }

  // 안내 문구: autoHideMs를 주면 그 시간 뒤에 사라진다 (오류는 계속 표시)
  function setMsg(t, autoHideMs) {
    clearTimeout(msgTimer);
    msg.textContent = t || '';
    msg.style.display = t ? 'block' : 'none';
    if (t && autoHideMs) msgTimer = setTimeout(function () { msg.style.display = 'none'; }, autoHideMs);
  }

  function stopStream() {
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
  }

  function setControls(on) {
    startBtn.style.display = on ? 'none' : '';
    row.classList.toggle('on', on);
  }

  function refreshThumb() {
    var first = gallery.querySelector('img');
    if (first) {
      thumbBtn.style.display = 'block';
      thumbBtn.style.backgroundImage = 'url("' + first.src + '")';
    } else {
      thumbBtn.style.display = 'none';
      thumbBtn.style.backgroundImage = '';
    }
  }

  function openPanel() {
    panel.hidden = false;
    closeBtn.focus();
  }
  function closePanel() {
    panel.hidden = true;
    if (thumbBtn.style.display !== 'none') thumbBtn.focus();
  }

  function explain(e) {
    var name = e && e.name ? e.name : '';
    switch (name) {
      case 'NotAllowedError':
      case 'SecurityError':
        return '카메라 접근이 허용되지 않았습니다.\n설정 > Safari > 카메라에서 허용으로 바꾼 뒤 다시 시도해 주세요.\n앱 안의 미리보기라면 링크를 Safari에서 직접 열어 주세요.';
      case 'NotFoundError':
      case 'DevicesNotFoundError':
        return '사용할 수 있는 카메라를 찾지 못했습니다.\n전/후면 전환 중이라면 이 기기에 해당 카메라가 없을 수 있습니다.';
      case 'NotReadableError':
      case 'TrackStartError':
        return '카메라를 사용할 수 없습니다.\n다른 앱이나 탭이 카메라를 쓰고 있다면 닫고 다시 시도해 주세요.';
      case 'OverconstrainedError':
        return '요청한 카메라 설정을 지원하지 않습니다. 다시 시도해 주세요.';
      default:
        return '카메라를 열지 못했습니다: ' + (name || e);
    }
  }

  async function startCamera() {
    if (busy) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      var secure = window.isSecureContext !== false;
      setMsg(secure
        ? '이 화면에서는 카메라를 쓸 수 없습니다.\n링크를 Safari 브라우저에서 직접 열어 주세요.'
        : '카메라는 HTTPS 주소에서만 사용할 수 있습니다.\nhttps:// 로 시작하는 주소로 열어 주세요.');
      setControls(false);
      return;
    }
    busy = true;
    startBtn.disabled = flipBtn.disabled = shotBtn.disabled = true;
    stopStream();
    try {
      var s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 4096 }, height: { ideal: 3072 } },
        audio: false
      });
      stream = s;
      var track = s.getVideoTracks()[0];
      if (track) {
        // 다른 앱이 카메라를 가져가거나 시스템이 끊었을 때 상태를 되돌린다
        track.addEventListener('ended', function () {
          if (stream === s) { stream = null; setMsg('카메라 연결이 끊어졌습니다. 화면으로 돌아오면 다시 연결합니다.'); }
        });
      }
      v.srcObject = s;
      // 전면 카메라는 프리뷰만 좌우 반전(거울 모드). 저장되는 사진은 반전하지 않는다.
      var settings = track && track.getSettings ? track.getSettings() : {};
      var isFront = settings.facingMode ? settings.facingMode === 'user' : facing === 'user';
      v.classList.toggle('mirror', isFront);
      await v.play();
      wantOn = true;
      setControls(true);
      setMsg('');
    } catch (e) {
      stopStream();
      wantOn = false;
      setControls(false);
      setMsg(explain(e));
    } finally {
      busy = false;
      startBtn.disabled = flipBtn.disabled = shotBtn.disabled = false;
    }
  }

  function saveFile(url, name) {
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  // 셔터 효과: 화면이 순간 어두워졌다가 부드럽게 돌아온다
  function shutterEffect() {
    if (!flash.animate) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    flash.animate(
      [{ opacity: 0.9 }, { opacity: 0.9, offset: 0.2 }, { opacity: 0 }],
      { duration: reduce ? 120 : 380, easing: 'ease-out' }
    );
  }

  function capture() {
    if (busy || !stream || !v.videoWidth) return;
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    shutterEffect();
    var apiImg = getKey() ? toApiImage(c) : null;
    c.toBlob(function (blob) {
      if (!blob) { setMsg('사진을 만들지 못했습니다. 다시 시도해 주세요.', 3000); return; }
      serial++;
      photoCount++;
      var url = URL.createObjectURL(blob);
      var stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
      var name = 'photo_' + stamp + '_' + serial + '.jpg';
      var item = document.createElement('div');
      item.className = 'item';
      var img = document.createElement('img');
      img.src = url;
      img.alt = name;
      var btns = document.createElement('div');
      btns.className = 'btns';
      var cap = document.createElement('div');
      cap.className = 'cap';

      var share = document.createElement('button');
      share.textContent = '공유/저장';
      share.onclick = async function () {
        var file = new File([blob], name, { type: 'image/jpeg' });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file] });
            return;
          }
        } catch (e) {
          if (e && e.name === 'AbortError') return; // 사용자가 취소
        }
        // 공유를 지원하지 않으면 파일로 내려받기
        saveFile(url, name);
      };

      var del = document.createElement('button');
      del.textContent = '삭제';
      del.onclick = function () {
        URL.revokeObjectURL(url);
        item.remove();
        photoCount = Math.max(0, photoCount - 1);
        refreshThumb();
        if (photoCount === 0) closePanel();
      };

      btns.appendChild(share);
      btns.appendChild(del);
      item.appendChild(img);
      item.appendChild(cap);
      item.appendChild(btns);
      gallery.insertBefore(item, gallery.firstChild);
      refreshThumb();
      if (apiImg) solve(apiImg, cap, ++latestId);
    }, 'image/jpeg', 0.95);
  }

  startBtn.onclick = startCamera;
  shotBtn.onclick = capture;
  flipBtn.onclick = function () {
    facing = facing === 'environment' ? 'user' : 'environment';
    startCamera();
  };
  ansEl.onclick = function () { setAns(''); };
  gearBtn.onclick = function () {
    var k = prompt('Anthropic API 키를 입력하세요.\n이 기기의 브라우저에만 저장됩니다. 비우고 확인하면 삭제됩니다.', '');
    if (k === null) return;
    k = k.trim();
    var ok = setKey(k);
    setMsg(!ok ? '키를 저장하지 못했습니다.' : k ? '키를 저장했습니다.' : '키를 삭제했습니다.', 2000);
  };
  thumbBtn.onclick = openPanel;
  window.addEventListener('beforeunload', function (e) {
    if (photoCount > 0) { e.preventDefault(); e.returnValue = ''; }
  });
  closeBtn.onclick = closePanel;
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) closePanel();
  });

  // 앱을 다른 화면으로 벗어났다가 돌아오면 끊긴 카메라를 다시 연결
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !wantOn || busy) return;
    var track = stream && stream.getVideoTracks()[0];
    if (!track || track.readyState === 'ended') startCamera();
  });


  startCamera(); // 페이지가 열리면 카메라 자동 시작
})();
</script>
</body>
</html>
